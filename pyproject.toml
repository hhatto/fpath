[project]
name = "fpath"
dynamic = ["version"]
description = "Fast Path manipulation module written in Rust"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Hideo Hattori", email = "hhatto.jp@gmail.com"},
]
requires-python = ">=3.13"
keywords = ["path", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "maturin==1.16.0"
]


[project.urls]
homepage = "https://github.com/hhatto/fpath"
repository = "https://github.com/hhatto/fpath"

[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "fpath._fpath"
include = [
    { path = "Cargo.lock", format = "sdist" }
]
exclude = [".github/**"]
locked = true
